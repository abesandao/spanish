<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2542D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hablemos">
<title>¡Hablemos!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --bg2:#f6f7fb; --ink:#3c3c48; --ink2:#8a8d99; --line:#e5e6ec;
  --pri:#F2542D; --pri-d:#c63e1c; --sun:#FFC23C; --sun-d:#e09b00;
  --teal:#14B8A6; --teal-d:#0e8a7c; --blue:#3B82F6; --blue-d:#2563c9;
  --ok:#2BB673; --ok-d:#1f8d58; --ok-bg:#e3f8ec; --ng:#EF4444; --ng-d:#bf2f2f; --ng-bg:#fde7e7;
  --purple:#9B5DE5; --purple-d:#7a3fc4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#eceef3}
body{font-family:"Nunito","M PLUS Rounded 1c",system-ui,sans-serif;color:var(--ink);font-weight:700}
button{font-family:inherit;font-weight:800;cursor:pointer;border:none;background:none;color:inherit}
#phone{max-width:440px;margin:0 auto;height:100%;padding-top:env(safe-area-inset-top,0px);background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.08)}
#main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.pad{padding:16px}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:2px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.stat{display:flex;align-items:center;gap:4px;font-weight:900;font-size:15px}
.flag{font-size:22px}

/* bottom nav */
nav{display:flex;border-top:2px solid var(--line);background:var(--bg);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;padding:6px 0;border-radius:12px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--ink2)}
nav button .ic{font-size:24px;line-height:1}
nav button.on{border-color:#b8d8ff;background:#eef6ff;color:var(--blue)}

/* 3D buttons */
.btn{display:block;width:100%;padding:14px 16px;border-radius:16px;font-size:16px;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--pri);box-shadow:0 4px 0 var(--pri-d);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.btn.ng{background:var(--ng);box-shadow:0 4px 0 var(--ng-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.sun{background:var(--sun);box-shadow:0 4px 0 var(--sun-d);color:#5a3b00}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{background:#e5e5e5;color:#afafaf;box-shadow:0 4px 0 #d0d0d0;cursor:default;transform:none}

/* path */
.unit-banner{margin:16px 16px 8px;border-radius:16px;padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.unit-banner small{display:block;opacity:.85;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.unit-banner b{font-size:18px}
.unit-banner .book{width:44px;height:44px;border:2px solid rgba(255,255,255,.5);border-radius:12px;display:grid;place-items:center;font-size:20px}
.path{position:relative;padding:12px 0 24px;display:flex;flex-direction:column;align-items:center;gap:18px}
.node{width:72px;height:66px;border-radius:50%;font-size:28px;display:grid;place-items:center;color:#fff;position:relative;transition:transform .05s}
.node:active{transform:translateY(4px)}
.node.locked{background:#e5e5e5 !important;box-shadow:0 7px 0 #c9c9c9 !important;color:#afafaf}
.node .crown{position:absolute;right:-6px;bottom:-4px;font-size:16px;background:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.start-tip{position:absolute;top:-44px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:13px;white-space:nowrap;color:var(--pri);font-weight:900;animation:bob 1.2s ease-in-out infinite;z-index:2}
.start-tip:after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes bob{50%{transform:translate(-50%,-4px)}}

/* cards */
.card{border:2px solid var(--line);border-radius:18px;padding:16px;background:#fff}
.h1{font-size:24px;font-weight:900;margin:4px 0 12px}
.muted{color:var(--ink2);font-size:13px}
.bar{height:16px;background:#e5e5e5;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .4s;position:relative}
.bar>i:after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;background:rgba(255,255,255,.4);border-radius:9px}

/* lesson */
.lesson{display:flex;flex-direction:column;height:100%}
.lhead{display:flex;align-items:center;gap:12px;padding:16px}
.lhead .bar{flex:1}
.lhead .bar>i{background:var(--ok)}
.x{font-size:24px;color:var(--ink2);width:28px}
.qbody{flex:1;padding:8px 16px 16px;overflow-y:auto}
.qtype{font-size:13px;color:var(--purple);font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.qtitle{font-size:22px;font-weight:900;margin:6px 0 18px}
.prompt{display:flex;align-items:flex-start;gap:12px;margin-bottom:22px}
.bubble{border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:20px;position:relative;flex:1}
.bubble:before{content:"";position:absolute;left:-10px;top:18px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.spk{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--blue);color:#fff;font-size:18px;box-shadow:0 3px 0 var(--blue-d);vertical-align:middle;margin-right:8px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{border:2px solid var(--line);border-radius:14px;padding:14px;font-size:17px;text-align:left;box-shadow:0 3px 0 var(--line);background:#fff}
.choice.sel{border-color:#84c8ff;background:#ddf4ff;color:#1a8fd8;box-shadow:0 3px 0 #84c8ff}
.choice.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-d)}
.choice.wrong{border-color:var(--ng);background:var(--ng-bg);color:var(--ng-d)}
.big-speaker{display:flex;gap:12px;justify-content:center;margin:10px 0 26px}
.big-speaker button{width:96px;height:96px;border-radius:24px;background:var(--blue);color:#fff;font-size:42px;box-shadow:0 5px 0 var(--blue-d)}
.big-speaker button.slow{width:64px;height:64px;font-size:26px;align-self:flex-end}
.answer-line{min-height:62px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;margin-bottom:24px;align-content:flex-start}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:17px;box-shadow:0 3px 0 var(--line);background:#fff}
.tile.used{background:#e5e5e5;color:transparent;box-shadow:none;border-color:#e5e5e5}
.typein{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:18px;font-family:inherit;font-weight:700;background:var(--bg2);min-height:100px;resize:none;color:var(--ink)}
.typein:focus{outline:none;border-color:#84c8ff}
.accents{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.accents button{border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-size:16px;box-shadow:0 2px 0 var(--line)}
.lfoot{padding:16px;border-top:2px solid var(--line)}
.sheet{padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet.ok{background:var(--ok-bg);color:var(--ok-d)}
.sheet.ng{background:var(--ng-bg);color:var(--ng-d)}
.sheet h3{margin:0 0 4px;font-size:22px;display:flex;align-items:center;gap:8px}
.sheet p{margin:0 0 14px;font-size:15px}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.hearts{color:var(--ng);font-weight:900;display:flex;align-items:center;gap:4px}

/* center screens */
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.bignum{font-size:96px;font-weight:900;color:var(--sun-d);line-height:1}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.week{display:flex;justify-content:space-between;gap:6px;margin:12px 0}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink2);flex:1}
.week i{width:28px;height:28px;border-radius:50%;background:#e5e5e5;display:grid;place-items:center;font-style:normal;color:#fff;font-size:14px}
.week i.on{background:var(--sun-d)}
.statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;margin:18px 0}
.statgrid .card{padding:10px;text-align:center}
.statgrid small{display:block;font-size:11px;color:#fff;margin:-10px -10px 8px;padding:4px;border-radius:14px 14px 0 0}

/* quests */
.quest{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:2px solid var(--line)}
.quest:last-child{border:0}
.quest .qi{font-size:30px;width:44px;text-align:center}
.quest .qt{flex:1}
.quest .qt b{display:block;margin-bottom:6px;font-size:15px}
.quest .bar{height:14px}
.quest .reward{font-size:24px}

/* roulette */
.wheel-wrap{position:relative;width:300px;height:300px;margin:8px auto 18px}
.wheel-wrap svg{width:100%;height:100%;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
#wheelG{transition:transform 4.2s cubic-bezier(.12,.8,.12,1);transform-origin:150px 150px}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--ink);z-index:2;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.hub{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:#fff;border:5px solid var(--ink);display:grid;place-items:center;font-size:26px}
.mission{border-radius:18px;padding:18px;background:linear-gradient(135deg,#fff6e0,#ffe9e2);border:2px solid #ffd7c9;text-align:left}
.mission .es{font-size:28px;font-weight:900;color:var(--pri);display:flex;align-items:center;gap:8px}
.mission .tip{background:#fff;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0 14px;color:var(--ink)}
.stamp{display:inline-block;border:4px solid var(--ok);color:var(--ok);border-radius:12px;padding:4px 14px;font-size:22px;font-weight:900;transform:rotate(-8deg);margin:6px 0}

/* words */
.wrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--line)}
.wrow .w{flex:1}
.wrow .w b{display:block;font-size:17px}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:#e5e5e5}
.dots i.on{background:var(--ok)}
.seg{display:flex;background:var(--bg2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:10px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 2px 0 var(--line)}

/* modal */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20;animation:fade .2s}
.modal .box{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease-out}
@keyframes fade{from{opacity:0}}
.field{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:16px;font-family:inherit;font-weight:700;margin:6px 0 14px;background:var(--bg2);color:var(--ink)}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;animation:fade .2s;white-space:nowrap}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:25}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div id="phone">
  <div id="main"></div>
  <nav id="nav"></nav>
</div>

<script>
/* ============ DATA ============ */
// Each item: es (Spanish), en/ja meaning
const UNITS = [

      ["la abuela","grandmother","祖母"],

      ["diez","ten (10)","10"],["cien","one hundred (100)","100"],["mil","one thousand (1000)","1000"]

      ["hablar","to speak","話す"],["trabajar","to work","働く"],["estudiar","to study","勉強する"],

      ["Vivo en Tokio","I live in Tokyo","私は東京に住んでいます"],

].map(u=>({...u, items:u.items.map(([es,en,ja])=>({es,en,ja,unit:u.id}))}));

// Daily-use phrases for roulette
const DAILY = [
  ["¿Qué tal?","How's it going?","調子どう？","Use it as a casual greeting instead of “Hi”.","「やあ」の代わりに気軽なあいさつとして使おう。"],
  ["¡Qué rico!","So tasty!","おいしい！","Say it when you eat something good.","おいしいものを食べた時に言ってみよう。"],

  ["¡Qué bonito!","How beautiful!","きれい！","Compliment something you see.","見たものをほめる時に使おう。"],
  ["No pasa nada","No problem / It's fine","大丈夫だよ","Say it when someone apologizes.","誰かに謝られた時に言ってみよう。"],
  ["¡Vamos!","Let's go!","行こう！","Use it when you start something together.","一緒に何かを始める時に言おう。"],
  ["¡Salud!","Cheers! / Bless you!","乾杯！ / お大事に！","Use it for a toast or after a sneeze.","乾杯やくしゃみの後に使おう。"],
  ["Estoy cansado","I'm tired","疲れた","Tell someone how you feel after work. (Women: cansada)","仕事の後の気分を伝えよう。（女性は cansada）"],
  ["¡Buen fin de semana!","Have a nice weekend!","よい週末を！","Say it on Friday when leaving.","金曜日の別れ際に言ってみよう。"],
  ["¡Cuídate!","Take care!","気をつけてね！","Use it when saying goodbye.","別れのあいさつで使おう。"],
  ["¿En serio?","Seriously?","マジで？","React to surprising news.","驚く話を聞いた時のリアクションに。"],
  ["¡Felicidades!","Congratulations!","おめでとう！","Congratulate someone today.","今日誰かをお祝いしよう。"],
  ["Me encanta","I love it","大好き","Tell someone what you love.","好きなものを伝えてみよう。"],
  ["¡Nos vemos!","See you!","またね！","Use it instead of “bye”.","「バイバイ」の代わりに使おう。"],
  ["¡Qué bien!","That's great!","いいね！","React positively to good news.","いい知らせへのリアクションに。"],
  ["Tengo hambre","I'm hungry","お腹すいた","Say it before lunch.","お昼の前に言ってみよう。"],
  ["¡Buenos días!","Good morning!","おはよう！","Greet the first person you meet.","最初に会った人にあいさつしよう。"],
  ["Muchas gracias","Thank you very much","本当にありがとう","Thank someone properly today.","今日しっかりお礼を言ってみよう。"],

const dayDiff = (a,b) => Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/864e5);
function freshDaily(){ return {date:today(), lessons:0, perfect:0, correct:0, spun:false, word:null, cleared:false, claimed:[], wheel:null}; }
function defaultState(){
  return {lang:(navigator.language||"ja").startsWith("ja")?"ja":"en", xp:0, gems:50, hearts:5, streak:0, lastActive:null, activeDays:[], done:{}, words:{}, daily:freshDaily(), log:[], tab:"learn"};
}

function rollDay(){
  if (S.daily.date !== today()){ S.daily = freshDaily(); S.hearts = 5; }
  if (S.lastActive && dayDiff(S.lastActive, today()) > 1) S.streak = 0;
  save();
}

function markActive(){ // returns true if streak advanced today
  const td = today();
  if (S.lastActive === td) return false;
  S.streak = (S.lastActive && dayDiff(S.lastActive, td) === 1) ? S.streak+1 : 1;
  S.lastActive = td;
  if (!S.activeDays.includes(td)) S.activeDays.push(td);
  S.activeDays = S.activeDays.slice(-60);
  return true;
}

const strength = es => { const w = S.words[es]; if(!w) return 0; return Math.max(0, Math.min(5, w.c - w.w*2 + (w.c>0?1:0))); };
const isWeak = es => { const w=S.words[es]; return w && w.w>0 && strength(es) < 3; };

const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[¿?¡!.,;:"“”'’]/g,"").replace(/\s+/g," ").trim();

function seeded(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%100000)/100000; }; }

/* ============ LESSON ENGINE ============ */
function findLesson(key){
  if (key==="weak") return {key, label:t("weak"), items:ALL_ITEMS.filter(i=>isWeak(i.es))};
  const [uid] = key.split(":"); const u = UNITS.find(x=>x.id===uid);
  return lessonsOf(u).find(l=>l.key===key);
}
function distractors(item, n, field){
  const same = ALL_ITEMS.filter(i=>i.unit===item.unit && i.es!==item.es);
  const other = ALL_ITEMS.filter(i=>i.unit!==item.unit);
  const pool = shuffle(same).concat(shuffle(other));
  const out=[], seen=new Set([field(item)]);
  for(const p of pool){ const v=field(p); if(!seen.has(v)){ seen.add(v); out.push(p);} if(out.length>=n) break; }
  return out;
}
function makeQuestion(item, idx, noType){
  const multi = words(item.es).length >= 2;
  const types = ["es2m","m2es"];
  if (canSpeak && !listenPaused()) types.push("listen");
  if (multi) types.push("build","build");
  if (strength(item.es) >= 2 && !noType) types.push("type");
  let type = types[(idx + Math.floor(Math.random()*types.length)) % types.length];
  if (idx===0) type = "es2m"; // gentle start
  const q = {type, item};
  if (type==="es2m") q.opts = shuffle([item, ...distractors(item,3,i=>mean(i))]);
  if (type==="m2es" || type==="listen") q.opts = shuffle([item, ...distractors(item,3,i=>i.es)]);
  if (type==="build"){
    const extra = shuffle(distractors(item,4,i=>i.es).flatMap(i=>words(i.es))).filter(w=>!words(item.es).map(norm).includes(norm(w))).slice(0,3);
    q.tiles = shuffle([...words(item.es), ...extra]).map((w,i)=>({w,i,used:false}));
    q.picked = [];
  }
  return q;
}
let L = null; // current lesson state
function startLesson(key){
  if (S.hearts <= 0){ toast(t("noHearts")); return; }
  const les = findLesson(key);
  if (!les || !les.items.length){ toast(t("noWeak")); return; }
  const pool = shuffle(les.items).slice(0, Math.min(10, les.items.length));
  // pad to at least 6 questions
  while(pool.length < 6) pool.push(les.items[Math.floor(Math.random()*les.items.length)]);
  L = {key, label:les.label, queue: pool.map((it,i)=>makeQuestion(it,i)), total: pool.length, doneCount:0, mistakes:0, answered:0, correctN:0, sel:null, state:"ask"};
  go("lesson");
}

/* ---- Endless word test ---- */
function startEndless(){
  const pool = ALL_ITEMS.filter(i=>S.endless.units.includes(i.unit));
  if (!pool.length){ toast(t("endPickOne")); return; }
  L = {endless:true, key:"endless", label:t("endless"), pool, queue:[], retry:[], lastEs:null,
       doneCount:0, mistakes:0, answered:0, correctN:0, combo:0, maxCombo:0, sel:null, state:"ask"};
  L.queue.push(nextEndlessQ());
  go("lesson");
}
function pickEndless(){
  let tot = 0;
  const ws = L.pool.map(i=>{ const w = i.es===L.lastEs ? 0 : 1 + (5-strength(i.es))*0.8 + (isWeak(i.es)?3:0); tot+=w; return w; });
  let r = Math.random()*tot;
  for (let k=0;k<L.pool.length;k++){ r-=ws[k]; if(r<=0) return L.pool[k]; }
  return L.pool[0];
}
function nextEndlessQ(){
  const due = L.retry.findIndex(x=>x.due<=L.answered && x.item.es!==L.lastEs);
  const item = due>=0 ? L.retry.splice(due,1)[0].item : pickEndless();
  L.lastEs = item.es;
  return makeQuestion(item, L.answered===0 ? 0 : L.answered+1, true);
}
function finishEndless(){
  const v = {correct:L.correctN, answered:L.answered, combo:L.maxCombo, gems:Math.floor(L.correctN/5)};
  v.newBest = v.correct > S.endless.best;
  if (v.newBest) S.endless.best = v.correct;
  S.endless.bestCombo = Math.max(S.endless.bestCombo, v.combo);
  S.gems += v.gems; S.xp += v.correct;
  v.advanced = L.correctN >= 10 ? markActive() : false;
  checkQuests(); save();
  view = Object.assign({name:"endres"}, v); render();
  if (v.correct) confetti();
}

    body = `<div class="qtitle">${t(tKey)}</div>
      <div class="big-speaker"><button onclick="speak(L.queue[0].item.es)">🔊</button><button class="slow" onclick="speak(L.queue[0].item.es,true)">🐢</button></div>
      <div class="choices">${q.opts.map((o,i)=>`<button class="choice ${choiceCls(q,i)}" onclick="pick(${i})">${esc(o.es)}</button>`).join("")}</div>`;
  } else if (q.type==="build"){
    body = `<div class="qtitle">${t(tKey)}</div>
      <div class="prompt">${mascot(64)}<div class="bubble">${esc(mean(q.item))}</div></div>
      <div class="answer-line">${q.picked.map((ti,k)=>`<button class="tile" onclick="unpickTile(${k})">${esc(q.tiles[ti].w)}</button>`).join("")}</div>
      <div class="tiles">${q.tiles.map((x,i)=>`<button class="tile ${x.used?"used":""}" onclick="pickTile(${i})">${esc(x.w)}</button>`).join("")}</div>
      <p class="muted" style="text-align:center">${t("tapWords")}</p>`;
  } else if (q.type==="type"){
    body = `<div class="qtitle">${t(tKey)}</div>
      <div class="prompt">${mascot(64)}<div class="bubble">${esc(mean(q.item))}</div></div>
      <textarea id="typein" class="typein" placeholder="${t("typeHere")}" oninput="L.sel=this.value;updateCheck()" ${L.state!=="ask"?"disabled":""}>${esc(L.sel||"")}</textarea>
      <div class="accents">${["á","é","í","ó","ú","ñ","ü","¿","¡"].map(a=>`<button onclick="addAccent('${a}')">${a}</button>`).join("")}</div>`;
  }
  let foot;
  if (L.state==="ask"){
    const skip = q.type==="listen" ? `<button class="btn ghost" ${L.endless?"":`style="margin-bottom:12px"`} onclick="skipListen()">${t("skipListen")}</button>` : "";
    foot = L.endless
      ? (skip ? `<div class="lfoot">${skip}</div>` : "")
      : `<div class="lfoot">${skip}<button class="btn ok" id="checkBtn" onclick="check()" ${hasAnswer()?"":"disabled"}>${t("check")}</button></div>`;
  } else {
    const ok = L.state==="right";
    foot = `<div class="sheet ${ok?"ok":"ng"}"><h3>${ok?"✅ "+t("correct"):"❌ "+t("wrong")}</h3>
      <p>${ok?"":`<b>${t("answer")}</b>${esc(q.item.es)}<br>`}<b>${t("meaning")}</b>${esc(q.item.es)} = ${esc(mean(q.item))}</p>
      <button class="btn ${ok?"ok":"ng"}" onclick="next()">${L.endless?t("nextQ"):t("cont")}</button></div>`;
  }
  $("#main").innerHTML = `<div class="lesson">
    ${L.endless
      ? `<div class="lhead"><button class="x" onclick="quitLesson()" aria-label="close">✕</button><div style="flex:1;display:flex;gap:16px;font-weight:900;font-size:16px"><span style="color:var(--ok)">✅ ${L.correctN}</span><span style="color:var(--ink2)">/ ${L.answered}</span></div><span class="stat" style="color:${L.combo>=3?"var(--pri)":"var(--ink2)"}">🔥 ${L.combo} ${t("combo")}</span></div>`
      : `<div class="lhead"><button class="x" onclick="quitLesson()" aria-label="close">✕</button><div class="bar"><i style="width:${pct}%"></i></div><span class="hearts">❤️ ${S.hearts}</span></div>`}
    <div class="qbody"><div class="qtype">${q.type==="build"||q.type==="type"?"✍️":(L.endless?"♾️":"⭐")} ${esc(L.label)}</div>${body}</div>
    ${foot}</div>`;
  if (q.type==="listen" && L.state==="ask" && !q.played){ q.played=true; setTimeout(()=>speak(q.item.es),300); }
  if (q.type==="type" && L.state==="ask"){ const ta=$("#typein"); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); }
}
function choiceCls(q,i){
  if (L.state==="ask") return L.sel===i?"sel":"";
  if (q.opts[i]===q.item) return "right";
  if (L.sel===i) return "wrong";
  return "";
}
function hasAnswer(){ const q=L.queue[0]; if(q.type==="build") return q.picked.length>0; if(q.type==="type") return !!(L.sel&&L.sel.trim()); return L.sel!==null; }
function updateCheck(){ const b=$("#checkBtn"); if(b) b.disabled=!hasAnswer(); }
function pick(i){ if(L.state!=="ask") return; L.sel=i; const q=L.queue[0]; if(L.endless){ check(); return; } if(q.type!=="es2m") speak(q.opts[i].es); renderLesson(); }
function pickTile(i){ const q=L.queue[0]; if(L.state!=="ask"||q.tiles[i].used) return; q.tiles[i].used=true; q.picked.push(i);
  if (L.endless && q.picked.length===words(q.item.es).length){ check(); return; }
  speak(q.tiles[i].w); renderLesson(); }
function unpickTile(k){ const q=L.queue[0]; if(L.state!=="ask") return; const ti=q.picked.splice(k,1)[0]; q.tiles[ti].used=false; renderLesson(); }
function addAccent(a){ const ta=$("#typein"); const s=ta.selectionStart, e=ta.selectionEnd; ta.value=ta.value.slice(0,s)+a+ta.value.slice(e); ta.selectionStart=ta.selectionEnd=s+a.length; L.sel=ta.value; ta.focus(); updateCheck(); }
const listenPaused = () => Date.now() < (S.noListenUntil || 0);
function skipListen(){
  S.noListenUntil = Date.now() + 30*60*1000; save();
  // Turn every queued listening question into a "choose the Spanish" one.
  L.queue.forEach(q=>{ if(q.type==="listen") q.type="m2es"; });
  L.sel=null; renderLesson(); toast("🔇 "+t("listenOff"));
}
function check(){
  if (!hasAnswer()) return;
  const q = L.queue[0]; let ok;
  if (q.type==="build") ok = norm(q.picked.map(i=>q.tiles[i].w).join(" ")) === norm(q.item.es);
  else if (q.type==="type") ok = norm(L.sel) === norm(q.item.es) || norm(L.sel) === norm(q.item.es.replace(/^(el|la|los|las) /i,""));
  else ok = q.opts[L.sel] === q.item;
  const w = wstat(q.item.es);
  L.answered++;
  if (ok){ w.c++; L.correctN++; S.daily.correct++; L.state="right"; speak(q.item.es); L.combo=(L.combo||0)+1; L.maxCombo=Math.max(L.maxCombo||0,L.combo); }
  else { w.w++; L.mistakes++; if(!L.endless) S.hearts=Math.max(0,S.hearts-1); L.state="wrong"; L.combo=0; }
  if (L.endless) checkQuests();
  save(); renderLesson();
  if (L.endless && ok){ clearTimeout(L.autoT); L.autoT = setTimeout(()=>{ if(view.name==="lesson" && L.state==="right") next(); }, 900); }
}
function next(){
  if (L.endless){
    clearTimeout(L.autoT);
    const q = L.queue.shift();
    if (L.state==="wrong") L.retry.push({item:q.item, due:L.answered+2});
    L.sel=null; L.state="ask";
    L.queue.push(nextEndlessQ());
    renderLesson(); return;
  }
  const q = L.queue.shift();
  if (L.state==="right") L.doneCount++;
  else L.queue.push(makeQuestion(q.item, 1)); // retry later
  L.sel=null; L.state="ask";
  if (S.hearts<=0){ go("fail"); return; }
  if (!L.queue.length){ finishLesson(); return; }
  renderLesson();
}
function quitLesson(){
  try{ speechSynthesis.cancel(); }catch(e){}
  if (L) clearTimeout(L.autoT);
  if (L && L.endless && L.answered>0){ finishEndless(); return; }
  go(S.tab);
}
function finishLesson(){
  const perfect = L.mistakes===0;
  const xp = 10 + (perfect?5:0);
  const gems = perfect ? 10 : 5;
  S.xp += xp; S.gems += gems;
  if (L.key!=="weak") S.done[L.key] = Math.max(S.done[L.key]||0, perfect?3:1);
  S.daily.lessons++; if(perfect) S.daily.perfect++;
  const advanced = markActive();
  checkQuests();
  save();
  view = {name:"result", xp, gems, perfect, acc: Math.round(L.correctN/L.answered*100), advanced};
  render(); confetti();
}

/* ============ ROULETTE ============ */
const WHEEL_COLORS = ["#F2542D","#FFC23C","#14B8A6","#3B82F6","#9B5DE5","#EF4444","#0EA5E9","#2BB673"];
function wheelItems(){
  if (!S.daily.wheel){
    const r = seeded(today()); const idx = DAILY.map((_,i)=>i).sort(()=>r()-.5).slice(0,8);
    S.daily.wheel = idx; save();
  }
  return S.daily.wheel.map(i=>DAILY[i]);
}
let wheelRot = 0, spinning = false;
function wheelSVG(items){
  const n=items.length, R=146, cx=150, cy=150; let s="";
  items.forEach((it,i)=>{
    const a0=(i/n)*2*Math.PI - Math.PI/2, a1=((i+1)/n)*2*Math.PI - Math.PI/2;
    const x0=cx+R*Math.cos(a0), y0=cy+R*Math.sin(a0), x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
    s += `<path d="M${cx},${cy} L${x0},${y0} A${R},${R} 0 0 1 ${x1},${y1} Z" fill="${WHEEL_COLORS[i%8]}" stroke="#fff" stroke-width="3"/>`;
    const mid = (i+.5)/n*360;
    const label = it.es.length>13 ? it.es.slice(0,12)+"…" : it.es;
    const ty = cy - R*0.58;
    s += `<text x="${cx}" y="${ty}" transform="rotate(${mid} ${cx} ${cy}) rotate(-90 ${cx} ${ty})" text-anchor="middle" dominant-baseline="middle"
      font-size="13" font-weight="900" fill="#fff" font-family="Nunito" style="paint-order:stroke" stroke="rgba(0,0,0,.25)" stroke-width="2">${esc(label)}</text>`;
  });
  return `<svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="149" fill="#fff"/><g id="wheelG" style="transform:rotate(${wheelRot}deg)">${s}</g></svg>`;
}
function renderRoulette(){
  const items = wheelItems(), d = S.daily;
  let missionHtml = "";
  if (d.word!==null){
    const w = DAILY[d.word];
    missionHtml = `<div class="mission pop" style="margin-top:4px">
      <div class="muted" style="color:var(--pri-d)">🎯 ${t("mission")}</div>
      <div class="es"><button class="spk" onclick="speak('${esc(w.es).replace(/'/g,"\\'")}')">🔊</button>${esc(w.es)}</div>
      <div style="font-size:16px;margin-top:2px">${esc(mean(w))}</div>
      <div class="tip">💡 ${esc(w.tip[S.lang])}</div>
      ${d.cleared ? `<div style="text-align:center"><div class="stamp">CLEAR!</div><p class="muted">${t("cleared")}</p></div>`
                  : `<p style="margin:0 0 12px;font-size:14px">${t("missionTxt")}</p><button class="btn ok" onclick="openClear()">🗣️ ${t("used")}</button>`}
    </div>`;
  }
  const logHtml = S.log.length ? S.log.slice().reverse().slice(0,20).map(l=>`<div class="wrow"><div class="w"><b>${esc(l.es)}</b><span class="muted">${esc(l.date)}${l.who?" · 👤 "+esc(l.who):""}${l.how?"<br>"+esc(l.how):""}</span></div><span>✅</span></div>`).join("")
                               : `<p class="muted">${t("noLog")}</p>`;
  $("#main").innerHTML = topbar() + `<div class="pad">
    <div class="h1" style="text-align:center;margin-bottom:4px">🎡 ${t("rTitle")}</div>
    <p class="muted" style="text-align:center;margin:0 0 6px">${t("rSub")}</p>
    <div class="wheel-wrap"><div class="pointer"></div>${wheelSVG(items)}<div class="hub">☀️</div></div>
    ${d.word===null ? `<button class="btn sun" id="spinBtn" onclick="spin()">${t("spin")}</button>` : ""}
    ${missionHtml}
    ${d.word!==null && !d.cleared ? `<button class="btn ghost" id="spinBtn" onclick="spin(true)" style="margin-top:14px">${t("respin")}</button>` : ""}
    <div class="h1" style="font-size:18px;margin-top:24px">📝 ${t("log")}</div>${logHtml}</div>`;
}
function spin(paid){
  if (spinning) return;
  if (paid){ if (S.gems<20){ toast(t("notEnough")); return; } S.gems-=20; }
  const items = wheelItems(), n = items.length;
  let pickIdx = Math.floor(Math.random()*n);
  if (paid && n>1 && S.daily.wheel[pickIdx]===S.daily.word) pickIdx=(pickIdx+1)%n;
  spinning = true;
  const btn=$("#spinBtn"); if(btn){ btn.disabled=true; btn.textContent=t("spinning"); }
  const segCenter = (pickIdx+.5)/n*360;
  const jitter = (Math.random()-.5)*(360/n)*0.6;
  const base = wheelRot - (wheelRot % 360);
  wheelRot = base + 360*6 + (360 - segCenter) + jitter;
  const g = document.getElementById("wheelG");
  requestAnimationFrame(()=>{ g.style.transform = `rotate(${wheelRot}deg)`; });
  setTimeout(()=>{
    spinning=false; S.daily.word = S.daily.wheel[pickIdx]; S.daily.spun=true; save();
    renderRoulette(); speak(DAILY[S.daily.word].es); confetti();
    const mc = document.querySelector(".mission"); if (mc) mc.scrollIntoView({behavior:"smooth", block:"center"});
  }, 4300);
}
function openClear(){
  const w = DAILY[S.daily.word];

  m.innerHTML = `<div class="box"><div class="h1" style="font-size:20px">🗣️ ${esc(w.es)}</div>
    <label class="muted">${t("who")}</label><input class="field" id="who" placeholder="${esc(t("whoPh"))}">

function doClear(){

  const m = document.createElement("div"); m.className="modal"; m.id="modal";
  m.innerHTML = `<div class="box"><div class="h1" style="font-size:20px">⚠️ ${t("resetQ")}</div>

  m.addEventListener("click", e=>{ if(e.target===m) m.remove(); });
  $("#phone").appendChild(m);
}
